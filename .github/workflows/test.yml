name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The suite is stdlib-only and fully offline by design, so it needs no
  # dependency install step and stays green when the bibliographic APIs are down.
  regressions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run regression suite
        working-directory: plugins/bib-audit/skills/bib-audit
        run: python3 -m unittest discover -s tests -v

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate plugin manifests and skill frontmatter
        run: |
          python3 - <<'PY'
          import json, pathlib, sys

          fail = []
          mk = json.load(open(".claude-plugin/marketplace.json"))
          for entry in mk["plugins"]:
              src = pathlib.Path(entry["source"])
              if not (src / ".claude-plugin" / "plugin.json").is_file():
                  fail.append(f"{entry['name']}: no plugin.json at {src}")
                  continue
              pj = json.load(open(src / ".claude-plugin" / "plugin.json"))
              if pj["name"] != entry["name"]:
                  fail.append(f"{entry['name']}: plugin.json name is {pj['name']}")
              if pj.get("version") != entry.get("version"):
                  fail.append(f"{entry['name']}: version differs between manifests")
              # Every skill needs name + description frontmatter or it never triggers.
              for skill in (src / "skills").iterdir():
                  sf = skill / "SKILL.md"
                  if not sf.is_file():
                      fail.append(f"{skill}: no SKILL.md")
                      continue
                  head = sf.read_text().split("---")
                  if len(head) < 3 or "name:" not in head[1] or "description:" not in head[1]:
                      fail.append(f"{sf}: missing name/description frontmatter")
          print("\n".join(fail) if fail else "manifests OK")
          sys.exit(1 if fail else 0)
          PY

  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install figure dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended texlive-pictures poppler-utils fonts-liberation
          python -m pip install -r plugins/research-paper-figures/skills/research-paper-figures/requirements.txt
      - name: Test figure helpers and packaged examples
        working-directory: plugins/research-paper-figures
        run: python -m unittest discover -s tests -v
      - name: Build the complete synthetic gallery
        working-directory: plugins/research-paper-figures
        run: python skills/research-paper-figures/scripts/build_gallery.py --output "$RUNNER_TEMP/figure-gallery"
